services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: test-${DB_NAME}
      POSTGRES_USER: test-${DB_USER}
      POSTGRES_PASSWORD: test-${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test-${DB_USER} -d test-${DB_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 20

  auth-test:
    build: 
      context: ./server
      target: test
    ports:
      - "${SERVE_PORT}:8080"
    environment:
      SERVE_HOST: 0.0.0.0
      SERVE_PORT: 8080
      TEST_DB_URL: db-test
      TEST_DB_USER: test-${DB_USER}
      TEST_DB_PASSWORD: test-${DB_PASSWORD}
      TEST_DB_NAME: test-${DB_NAME}
      JWT_SECRET: test_${JWT_SECRET}
    depends_on:
      db-test:
        condition: service_healthy